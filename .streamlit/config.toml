[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0a0e14"
secondaryBackgroundColor = "#111720"
textColor = "#e6edf3"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = true

[logger]
level = "info"
